name: Test Automation - Secure Run

on:
  push:
    branches: [ codex/build-salesforce-login-automation, main ]
  pull_request:
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Execute Tests with Credentials
        env:
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SF_RESET_USERNAME: ${{ secrets.SF_RESET_USERNAME }}
        run: mvn clean test -Dheadless=true -Dsf.reset.submit.enabled=true -DvisualAgent=false
